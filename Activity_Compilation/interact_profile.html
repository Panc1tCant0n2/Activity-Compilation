<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Profile</title>
<style>
body {
  font-family: 'Segoe UI', sans-serif;
  margin: 0;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #333;
}

.nav-buttons {
  text-align: center;
  margin-top: 20px;
}

.nav-buttons button {
  margin: 5px;
  background: #2d3748;
}

.container {
  max-width: 900px;
  margin: 30px auto;
  background: white;
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

h1 {
  text-align: center;
}

section {
  margin-bottom: 25px;
  padding: 15px;
  border-radius: 15px;
  background: #f9f9f9;
}

img {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  cursor: pointer;
  display: block;
  margin: 10px auto;
  border: none; /* removed blue circle border */
  background: #e2e8f0; /* subtle placeholder */
}

button {
  margin: 5px;
  padding: 8px 12px;
  border: none;
  border-radius: 10px;
  background: #667eea;
  color: white;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #5a67d8;
}

ul {
  list-style: none;
  padding: 0;
}

li {
  padding: 8px;
  margin: 5px 0;
  border-radius: 8px;
  background: #e2e8f0;
  cursor: pointer;
  transition: 0.2s;
}

li:hover {
  background: #cbd5f5;
}

.highlight {
  background: #fbbf24 !important;
}

input {
  padding: 8px;
  margin-top: 5px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.bottom-controls {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 20px;
}

.reset {
  background: #e53e3e;
}

.reset:hover {
  background: #c53030;
}

.save {
  background: #38a169;
}

.save:hover {
  background: #2f855a;
}
</style>
</head>
<body>


<div class="container">
<h1>✨ My Interactive Profile ✨</h1>

<section>
<h2 id="name">Your Name</h2>
<button onclick="editText('name')">✏️ Edit</button>
<p id="bio">Your bio here...</p>
<button onclick="editText('bio')">✏️ Edit</button>
<img id="profilePic" src="https://via.placeholder.com/120">
<input type="file" id="fileInput" hidden>
</section>

<section>
<h3>💻 Skills</h3>
<ul id="skills"></ul>
<button onclick="showInput('skills')">➕ Add Skill</button>
<button onclick="deleteSelected('skills')">🗑 Delete</button>
</section>

<section>
<h3>🎮 Hobbies</h3>
<ul id="hobbies"></ul>
<button onclick="showInput('hobbies')">➕ Add Hobby</button>
<button onclick="deleteSelected('hobbies')">🗑 Delete</button>
</section>

<!-- BOTTOM CONTROLS -->
<div class="bottom-controls">
  <button class="reset" onclick="resetAll()">Reset</button>
  <button class="save" onclick="manualSave()">Save</button>
</div>

</div>

<!-- OUTSIDE NAV BUTTONS -->
<div class="nav-buttons">
  <button onclick="goPage('index.html')"> Home</button>
  <button onclick="goBack()"> Back</button>
  <button onclick="reloadPage()"> Reload</button>
  <button onclick="goForward()"> Forward</button>
</div>

<script>
let data = JSON.parse(localStorage.getItem('profile')) || {
  name: 'Your Name',
  bio: 'Your bio here...',
  skills: ['HTML','CSS','JavaScript'],
  hobbies: ['Reading','Gaming','Music'],
  image: 'https://via.placeholder.com/120'
};

function save() {
  localStorage.setItem('profile', JSON.stringify(data));
}

function manualSave() {
  save();
  console.log('Data manually saved');
  alert('Saved successfully!');
}

function load() {
  document.getElementById('name').textContent = data.name;
  document.getElementById('bio').textContent = data.bio;
  document.getElementById('profilePic').src = data.image;
  renderList('skills');
  renderList('hobbies');
}

function renderList(type) {
  const ul = document.getElementById(type);
  ul.innerHTML = '';

  data[type].forEach((item, index) => {
    const li = document.createElement('li');
    li.textContent = item;

    li.onclick = () => {
      li.classList.toggle('highlight');
      console.log(type + ' selected');
    };

    li.draggable = true;
    li.ondragstart = (e) => e.dataTransfer.setData('text/plain', index);
    li.ondragover = (e) => e.preventDefault();

    li.ondrop = (e) => {
      const from = e.dataTransfer.getData('text/plain');
      [data[type][from], data[type][index]] = [data[type][index], data[type][from]];
      console.log(type + ' reordered');
      save();
      load();
    };

    ul.appendChild(li);
  });
}

function showInput(type) {
  const input = document.createElement('input');
  input.placeholder = 'Enter ' + type;

  input.onkeypress = (e) => {
    if (e.key === 'Enter' && input.value.trim() !== '') {
      data[type].push(input.value);
      console.log(type + ' added: ' + input.value);
      input.remove();
      save();
      load();
    }
  };

  document.getElementById(type).after(input);
}

function deleteSelected(type) {
  const items = document.querySelectorAll('#' + type + ' .highlight');
  data[type] = data[type].filter(item =>
    ![...items].some(li => li.textContent === item)
  );
  console.log(type + ' deleted');
  save();
  load();
}

function editText(id) {
  const el = document.getElementById(id);
  const input = document.createElement('input');
  input.value = el.textContent;

  input.onblur = saveText;
  input.onkeypress = (e) => {
    if (e.key === 'Enter') saveText();
  };

  function saveText() {
    el.textContent = input.value;
    data[id] = input.value;
    console.log(id + ' edited');
    input.remove();
    save();
  }

  el.after(input);
}

const pic = document.getElementById('profilePic');
const fileInput = document.getElementById('fileInput');

pic.onclick = () => fileInput.click();

fileInput.onchange = () => {
  const file = fileInput.files[0];
  const reader = new FileReader();

  reader.onload = () => {
    pic.src = reader.result;
    data.image = reader.result;
    console.log('Profile picture updated');
    save();
  };

  reader.readAsDataURL(file);
};

function resetAll() {
  localStorage.removeItem('profile');
  console.log('Reset to default');
  location.reload();
}

function goPage(page) {
  console.log('Redirecting to ' + page);
  window.location.href = page;
}

function goBack() {
  console.log('Navigated back');
  window.history.back();
}

function goForward() {
  console.log('Navigated forward');
  window.history.forward();
}

function reloadPage() {
  console.log('Page reloaded');
  location.reload();
}

load();
</script>

</body>
</html>
